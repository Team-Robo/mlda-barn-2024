global_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 10
  publish_frequency: 5
  width: 60.0
  height: 60.0
  resolution: 0.05
  origin_x: -30.0
  origin_y: -30.0 
  static_map: true
  rolling_window: false

  # Allow planning through unknown space
  track_unknown_space: true
  unknown_cost_value: 0